name: Gerar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependências
        run: npm install

      - name: Preparar PDF.js
        run: |
          mkdir -p www/vendor/pdfjs
          cp node_modules/pdfjs-dist/build/pdf.mjs www/vendor/pdfjs/pdf.mjs
          cp node_modules/pdfjs-dist/build/pdf.worker.mjs www/vendor/pdfjs/pdf.worker.mjs

      - name: Criar projeto Android
        run: npx cap add android

      - name: Sincronizar app
        run: npx cap sync android

      - name: Gerar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Meu-Manhwa-V3-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
