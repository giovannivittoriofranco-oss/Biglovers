<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minhu</title><link rel="stylesheet" href="style.css"><script src="app.js"></script><script src="db.js"></script></head><body><header class="top"><button class="iconbtn" onclick="back()">←</button><h1>Minhu</h1><button class="iconbtn" onclick="openPost()">＋</button></header><main class="wrap"><div class="notice">Publique fotos e vídeos como uma rede social: legenda, curtidas, comentários, compartilhamento e exclusão.</div><div id="feed"></div></main><div class="modal" id="modal"><div class="sheet"><div class="studio-head"><h2 style="flex:1">Nova publicação</h2><button class="iconbtn" onclick="closePost()">✕</button></div><div class="form"><div class="field"><label>Legenda</label><textarea id="caption" placeholder="Escreva uma legenda..."></textarea></div><div class="field"><label>Foto ou vídeo</label><input id="media" type="file" accept="image/*,video/*" multiple></div><div class="media-preview" id="preview"></div><button class="primary" onclick="publish()">Publicar no Minhu</button></div></div></div><nav class="bottom"><button onclick="go('index.html')">⌂<small>Início</small></button><button class="active">◉<small>Minhu</small></button><button onclick="go('descobrir.html')">◇<small>Descobrir</small></button><button onclick="go('estudio.html')">▣<small>Estúdio</small></button><button onclick="go('perfil.html')">♙<small>Perfil</small></button></nav><script>let selected=[];media.onchange=async e=>{selected=[...e.target.files].slice(0,10);preview.innerHTML='';for(const f of selected){const u=await saveFile(f);preview.innerHTML+=f.type.startsWith('video')?`<video class="postmedia" controls src="${u}"></video>`:`<img class="postmedia" src="${u}">`}};function openPost(){modal.style.display='block'}function closePost(){modal.style.display='none'}async function publish(){if(!selected.length){alert('Escolha uma foto ou vídeo.');return}const files=[];for(const f of selected)files.push({type:f.type.startsWith('video')?'video':'image',src:await saveFile(f)});const post={id:Date.now(),caption:caption.value.trim(),files,likes:0,comments:[],created:Date.now()};await dbPut('posts',post);caption.value='';media.value='';selected=[];preview.innerHTML='';closePost();render()}async function render(){const a=(await dbGetAll('posts')).sort((x,y)=>y.created-x.created);feed.innerHTML=a.length?a.map(p=>`<article class="post"><div class="posthead"><div class="avatar">✦</div><b>Meu Perfil</b></div>${p.files.map(f=>f.type==='video'?`<video class="postmedia" controls playsinline src="${f.src}"></video>`:`<img class="postmedia" src="${f.src}">`).join('')}<div class="postbody"><div>${esc(p.caption)}</div><div class="postactions"><button onclick="like(${p.id})">♡ ${p.likes}</button><button onclick="comment(${p.id})">💬 Comentar</button><button onclick="sharePost(${p.id})">↗ Compartilhar</button><button onclick="del(${p.id})">🗑 Apagar</button></div></div></article>`).join(''):'<div class="empty">Ainda não há publicações.<br><br>Toque em ＋ para publicar uma foto ou vídeo.</div>'}async function like(id){const p=await dbGet('posts',id);p.likes++;await dbPut('posts',p);render()}async function comment(id){const p=await dbGet('posts',id);const c=prompt('Seu comentário:');if(c){p.comments.push(c);await dbPut('posts',p);alert('Comentário salvo.')}}async function sharePost(id){const p=await dbGet('posts',id);if(navigator.share)navigator.share({title:'Meu Manhwa',text:p.caption||'Veja esta publicação'});else alert('Publicação pronta para compartilhar.')}async function del(id){if(confirm('Apagar publicação?')){await dbDelete('posts',id);render()}}render()</script></body></html>
