<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu Manhwa</title><link rel="stylesheet" href="style.css"><script src="app.js"></script><script src="db.js"></script></head><body><header class="top"><h1>✦ Meu Manhwa</h1><button class="iconbtn" onclick="go('config.html')">⚙️</button></header><main class="wrap"><section class="hero"><h2>Leia, publique e crie.</h2><div class="muted">Seu espaço para Manhwa, Manhua, Mangá, Novel e Minhu.</div><input class="search" id="q" placeholder="Pesquisar obras..." oninput="render()"><div class="chips" id="chips"><button class="on" onclick="setCat('Todos',this)">Todos</button><button onclick="setCat('Manhwa',this)">Manhwa</button><button onclick="setCat('Manhua',this)">Manhua</button><button onclick="setCat('Mangá',this)">Mangá</button><button onclick="setCat('Novel',this)">Novel</button></div></section><section class="section"><h2>📚 Obras</h2><div class="grid" id="works"></div></section></main><nav class="bottom"><button class="active">⌂<small>Início</small></button><button onclick="go('minhu.html')">◉<small>Minhu</small></button><button onclick="go('descobrir.html')">◇<small>Descobrir</small></button><button onclick="go('estudio.html')">▣<small>Estúdio</small></button><button onclick="go('perfil.html')">♙<small>Perfil</small></button></nav><script>let cat='Todos';function setCat(x,b){cat=x;document.querySelectorAll('#chips button').forEach(v=>v.classList.remove('on'));b.classList.add('on');render()}async function render(){let a=await dbGetAll('works');let q=document.getElementById('q').value.toLowerCase();a=a.filter(w=>(cat==='Todos'||w.type===cat)&&(!q||w.title.toLowerCase().includes(q)||String(w.genre).toLowerCase().includes(q)));let el=document.getElementById('works');el.innerHTML=a.length?a.map(w=>`<article class="card" onclick="go('obra.html?id=${w.id}')"><img class="cover" src="${w.cover||''}"><div class="cardbody"><h3>${esc(w.title)}</h3><div class="muted">${esc(w.type)} · ${esc(w.status||'Em andamento')}</div></div></article>`).join(''):'<div class="empty" style="grid-column:1/-1">Nenhuma obra ainda.<br><br>Abra o Estúdio para criar sua primeira história.</div>'}render();</script></body></html>
