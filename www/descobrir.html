<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Descobrir</title><link rel="stylesheet" href="style.css"><script src="app.js"></script><script src="db.js"></script></head><body><header class="top"><button class="iconbtn" onclick="back()">←</button><h1>Descobrir</h1></header><main class="wrap"><div class="hero"><h2>Descobrir histórias</h2><div class="muted">Explore as obras que estão salvas neste aparelho.</div></div><section class="section"><div class="grid" id="grid"></div></section></main><nav class="bottom"><button onclick="go('index.html')">⌂<small>Início</small></button><button onclick="go('minhu.html')">◉<small>Minhu</small></button><button class="active">◇<small>Descobrir</small></button><button onclick="go('estudio.html')">▣<small>Estúdio</small></button><button onclick="go('perfil.html')">♙<small>Perfil</small></button></nav><script>dbGetAll('works').then(a=>grid.innerHTML=a.length?a.map(w=>`<article class="card" onclick="go('obra.html?id=${w.id}')"><img class="cover" src="${w.cover}"><div class="cardbody"><h3>${esc(w.title)}</h3><div class="muted">${esc(w.type)}</div></div></article>`).join(''):'<div class="empty" style="grid-column:1/-1">Nada para descobrir ainda.</div>')</script></body></html>
